# Keep cameras out of PipeWire. OBS reads the camera directly (V4L2), and when
# WirePlumber manages it too, every camera reconnect makes it (a) probe the
# device while OBS is opening it and (b) try to re-link OBS's screen-capture
# stream to the camera, which kills screen sharing.
# Delete this file and run `systemctl --user restart wireplumber` to undo.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
